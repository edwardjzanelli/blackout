<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Diskard</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main id="blackout-popup">
      <h1>Diskard</h1>

      <label class="switch-row">
        <input id="on-switch" type="checkbox" />
        <span>Diskard is on</span>
      </label>

      <label class="switch-row">
        <input id="site-switch" type="checkbox" />
        <span>Pause on <span id="site-name">this site</span></span>
      </label>

      <p id="page-count" class="page-count">Not available on this page</p>

      <dl class="counts">
        <div><dt>Blocked today</dt><dd id="count-today">0</dd></div>
        <div><dt>Brain cells saved</dt><dd id="count-total">0</dd></div>
      </dl>

      <button id="open-settings" type="button" class="settings">Settings</button>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
