<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Script noise</title>
  </head>
  <body>
    <!-- A matching term appears in non-visible places (JSON-LD, inline script, CSS)
         as well as in one real visible card. Only the card must be scanned. -->
    <script type="application/ld+json">
      { "@type": "ItemList", "name": "Quendle search results" }
    </script>
    <script>
      var pageData = { searchTerm: "Quendle", page: 1 };
    </script>
    <style>
      .promo::after { content: "Quendle"; }
    </style>
    <main>
      <article id="real">
        <h3>Quendle spotted downtown</h3>
        <p>Photos inside.</p>
      </article>
    </main>
  </body>
</html>
